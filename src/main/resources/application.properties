spring.application.name=itv-internship


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/category_management?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:8080}


app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}